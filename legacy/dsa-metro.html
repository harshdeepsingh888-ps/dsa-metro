      } else {
        filled[i][j] = true; showDeps = deps[i][j];
        advance('It is ' + fmt(t) + '. ' + why[i][j], 'bad');
      }
    }
  }
  function reveal() {
    if (finished || pos >= order.length) return;
    const [i, j] = order[pos];
    filled[i][j] = true; showDeps = deps[i][j]; combo = 0;
    advance(cfg.name(i, j) + ' is ' + fmt(truth[i][j]) + '. ' + why[i][j]);
  }
  function stepWatch() {
    if (finished || pos >= order.length) return;
    const [i, j] = order[pos];
    filled[i][j] = true; showDeps = deps[i][j];
    advance(cfg.name(i, j) + ' = ' + fmt(truth[i][j]) + '. ' + why[i][j]);
  }
  function play() { bPlay.textContent = 'Pause'; timer = setInterval(() => { if (finished) { stop(); return; } stepWatch(); }, 1000); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } bPlay.textContent = 'Play'; }
  function finish(lastLine) {
    stop(); finished = true; showDeps = [];
    let line = 'Table complete.';
    if (cfg.trace) { const tr = cfg.trace(get); pathKeys = new Set(tr.cells.map(([a, b]) => key(a, b))); line = tr.msg; if (cfg.side && cfg.side.finish) cfg.side.finish(tr); }
    else if (cfg.doneMsg) line = cfg.doneMsg(get);
    paint(); setCtrls();
    status.innerHTML = '';
    if (lastLine) status.append(h('p', {}, lastLine));
    status.append(h('p', { class: 'good' }, line));
    if (mode === 'predict' && correct) status.append(h('p', { class: 'next' }, 'You got ' + correct + ' of ' + order.length + ' cells right on the first try.'));
  }
  function setMode(m) {
    stop(); mode = m; tries = 0; showDeps = [];
    modeSeg.set(m); setCtrls(); paint();
    say(m === 'predict' ? 'Your turn. Each correct cell on the first try is +2 XP.' : 'Watch mode. Each step fills one cell and highlights the cells it was built from.');
  }
  function reset() {
    stop(); finished = false; pos = 0; tries = 0; combo = 0; correct = 0; showDeps = []; pathKeys = null; input.value = '';
    filled = isBase.map(r => r.slice());
    if (cfg.side && cfg.side.reset) cfg.side.reset();
    setCtrls(); paint();
    say(mode === 'predict' ? 'Your turn. Each correct cell on the first try is +2 XP.' : 'Watch mode. Each step fills one cell and highlights the cells it was built from.');
  }
  onCleanup(stop);
  reset();
}

function vizStairs(host, st) {

  function build() {
    nOut.textContent = n; holder.innerHTML = '';
    const stairs = h('div', { class: 'stairs', 'aria-hidden': 'true' });
    const els = [];
    for (let i = 0; i <= n; i++) { const e = h('div', { class: 'stair', style: 'height:' + (16 + i * (82 / n)) + 'px' }, i); els.push(e); stairs.append(e); }
    DPTable(holder, st, {
      rows: 1, cols: n + 1, corner: 'step', rowHead: () => 'ways', colHead: j => j,
      base: (i, j) => j <= 1, baseVal: () => 1,
      calc: (i, j, g) => { const a = g(0, j - 1), b = g(0, j - 2); return { v: a + b, deps: [[0, j - 1], [0, j - 2]], why: 'ways(' + j + ') = ways(' + (j - 1) + ') + ways(' + (j - 2) + ') = ' + a + ' + ' + b + ' = ' + (a + b) + '.' }; },
      name: (i, j) => 'ways(' + j + ')',
      hint: () => 'Add the two highlighted cells: the ways to reach one step below and two steps below.',

      side: { el: stairs, focus(cur, deps) { els.forEach((e, k) => { e.classList.toggle('cur', !!cur && cur[1] === k); e.classList.toggle('dep', deps.some(d => d[1] === k)); }); } },
    });

}

function vizRobber(host, st) {
  let cash = [6, 2, 9, 5, 1, 8];
  const holder = h('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  host.append(h('div', { class: 'setup' }, h('span', {}, 'Cash in each house (₹ thousand)'), btn('New street', () => { cash = Array.from({ length: 6 }, () => 1 + Math.floor(Math.random() * 9)); build(); }, 'ghost')), holder);
  function build() {
    holder.innerHTML = '';
    const n = cash.length;
    const street = h('div', { class: 'street' });
    const houses = cash.map((c, i) => { const e = h('div', { class: 'house' }, h('div', { class: 'roof' }), h('div', { class: 'body' }, '₹' + c), h('div', { class: 'hl' }, 'H' + (i + 1))); street.append(e); return e; });
    DPTable(holder, st, {
      rows: 1, cols: n + 1, corner: 'houses', rowHead: () => 'best', colHead: k => k === 0 ? '0' : 'H' + k,
      base: (i, k) => k === 0, baseVal: () => 0,
      calc: (i, k, g) => {
        const skip = g(0, k - 1), back = k >= 2 ? g(0, k - 2) : 0, take = cash[k - 1] + back, v = Math.max(skip, take);
        return { v, deps: k >= 2 ? [[0, k - 1], [0, k - 2]] : [[0, k - 1]], why: 'Skip H' + k + ': ' + skip + '. Rob H' + k + ': ' + cash[k - 1] + ' + ' + back + ' = ' + take + '. Best = ' + v + '.' };
      },
      name: (i, k) => 'dp[' + k + ']',
      hint: (i, k) => 'Compare skipping H' + k + ' (the cell just before) with robbing it (₹' + cash[k - 1] + ' plus the cell two back).',
      trace: g => {
        let k = n; const taken = [];
        while (k >= 1) { if (g(0, k) === g(0, k - 1)) k--; else { taken.push(k); k -= 2; } }
        taken.reverse();
        return { cells: taken.map(x => [0, x]), taken, msg: 'Rob ' + taken.map(x => 'H' + x).join(', ') + ' for ₹' + g(0, n) + ' thousand. The highlighted cells are where robbing won.' };
      },
      side: {
        el: street,
        focus(cur) { houses.forEach((e, i) => e.classList.toggle('cur', !!cur && cur[1] === i + 1)); },
        finish(tr) { houses.forEach((e, i) => e.classList.toggle('robbed', tr.taken.includes(i + 1))); },
        reset() { houses.forEach(e => e.classList.remove('robbed')); },
      },
    });
  }
  build();
}

function vizCoins(host, st) {
  const PRESETS = [{ coins: [1, 3, 4], amt: 6 }, { coins: [1, 5, 6], amt: 10 }, { coins: [2, 5], amt: 8 }];
  let p = 0;
  const holder = h('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  const sg = seg(PRESETS.map((x, i) => [String(i), x.coins.map(c => '₹' + c).join(' ') + ' → ₹' + x.amt]), '0', v => { p = +v; build(); }, 'Coin set');
  host.append(h('div', { class: 'setup' }, h('span', {}, 'Coins and amount'), sg.el), holder);
  const greedy = (coins, amt) => { let rem = amt, cnt = 0; for (const c of [...coins].sort((a, b) => b - a)) while (rem >= c) { rem -= c; cnt++; } return rem === 0 ? cnt : null; };
  function build() {
    holder.innerHTML = '';
    const { coins, amt } = PRESETS[p];
    const fmt = v => v === Infinity ? '∞' : v;
    DPTable(holder, st, {
      rows: 1, cols: amt + 1, corner: 'amount', rowHead: () => 'coins', colHead: a => '₹' + a,
      base: (i, a) => a === 0, baseVal: () => 0,
      calc: (i, a, g) => {
        const opts = coins.filter(c => c <= a).map(c => ({ c, v: g(0, a - c) + 1 }));
        const v = opts.length ? Math.min(...opts.map(o => o.v)) : Infinity;
        return {
          v, deps: coins.filter(c => c <= a).map(c => [0, a - c]),
          why: opts.length ? opts.map(o => 'last coin ₹' + o.c + ': ' + fmt(g(0, a - o.c)) + ' + 1 = ' + fmt(o.v)).join(' · ') + '. Smallest: ' + fmt(v) + '.' : 'No coin fits in ₹' + a + ', so it is ∞.',
        };
      },
      name: (i, a) => 'dp[₹' + a + ']',
      hint: () => 'For each coin, look back that many cells (highlighted) and add 1. Take the smallest. Type inf if nothing works.',
      doneMsg: g => {
        const v = g(0, amt), gr = greedy(coins, amt);
        const base = v === Infinity ? '₹' + amt + ' can\'t be made with these coins.' : '₹' + amt + ' needs ' + v + ' coin' + (v === 1 ? '' : 's') + '.';
        return base + (gr === v ? ' Greedy happens to agree this time.' : gr == null ? ' Greedy (biggest coin first) gets stuck and finds no answer at all.' : ' Greedy (biggest coin first) would use ' + gr + '.');
      },
      side: { el: h('div', { class: 'coins' }, coins.map(c => h('div', { class: 'coin' }, '₹' + c))) },
    });
  }
  build();
}

function vizGridPaths(host, st) {
  const R = 4, C = 6;
  const DEFAULT = ['1,1', '1,4', '2,2'];
  let blocks = new Set(DEFAULT);
  const holder = h('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  host.append(h('div', { class: 'setup' },
    h('span', { class: 'viz-note' }, 'Click any cell to add or remove a block before you fill in the first value.'),
    btn('Clear blocks', () => { blocks = new Set(); build(); }, 'ghost'),
    btn('Random blocks', () => { blocks = new Set(); while (blocks.size < 4) { const r = Math.floor(Math.random() * R), c = Math.floor(Math.random() * C); if (!(r === 0 && c === 0) && !(r === R - 1 && c === C - 1)) blocks.add(r + ',' + c); } build(); }, 'ghost')), holder);
  function build() {
    holder.innerHTML = '';
    const B = (i, j) => blocks.has(i + ',' + j);
    DPTable(holder, st, {
      rows: R, cols: C, corner: '', rowHead: i => 'r' + i, colHead: j => 'c' + j,
      base: (i, j) => B(i, j) || (i === 0 && j === 0), baseVal: (i, j) => B(i, j) ? 0 : 1,
      calc: (i, j, g) => {
        const up = i > 0 ? g(i - 1, j) : null, left = j > 0 ? g(i, j - 1) : null;
        const v = (up || 0) + (left || 0);
        const d = []; if (i > 0) d.push([i - 1, j]); if (j > 0) d.push([i, j - 1]);
        return { v, deps: d, why: i === 0 ? 'Top row: only from the left, ' + left + '.' : j === 0 ? 'Left column: only from above, ' + up + '.' : 'From above ' + up + ' + from the left ' + left + ' = ' + v + '.' };
      },
      cellClass: (i, j) => B(i, j) ? 'blocked' : (i === 0 && j === 0) ? 'start' : (i === R - 1 && j === C - 1) ? 'goal' : '',
      clickable: (i, j) => !(i === 0 && j === 0) && !(i === R - 1 && j === C - 1),
      onCellClick: (i, j) => { const k = i + ',' + j; if (blocks.has(k)) blocks.delete(k); else blocks.add(k); build(); },
      name: (i, j) => 'paths[' + i + '][' + j + ']',
      hint: () => 'Add the cell above and the cell to the left. A blocked cell counts as 0.',
      doneMsg: g => g(R - 1, C - 1) + ' routes reach the canteen. Move the blocks around and fill it again.',
    });
  }
  build();
}

function vizLCS(host, st) {
  const PRESETS = [['STONE', 'LONGEST'], ['CHAI', 'CHAAT'], ['ABCD', 'ACBD']];
  let A = 'STONE', B = 'LONGEST';
  const ia = h('input', { type: 'text', id: 'lcs-a', value: A, maxlength: '8', 'aria-label': 'String A' });
  const ib = h('input', { type: 'text', id: 'lcs-b', value: B, maxlength: '8', 'aria-label': 'String B' });
  const holder = h('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  const clean = t => t.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8);
  host.append(h('div', { class: 'setup' }, h('label', { for: 'lcs-a' }, 'A'), ia, h('label', { for: 'lcs-b' }, 'B'), ib, btn('Build table', () => use(ia.value, ib.value), 'primary'),
    PRESETS.map(([a, b]) => btn(a + ' / ' + b, () => use(a, b), 'ghost'))), holder);
  [ia, ib].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter') use(ia.value, ib.value); }));
  function use(a, b) {
    a = clean(a); b = clean(b);
    if (!a || !b) { holder.innerHTML = ''; holder.append(h('p', { class: 'msg bad' }, 'Type at least one letter in each string.')); return; }
    A = a; B = b; ia.value = a; ib.value = b; build();
  }
  function build() {
    holder.innerHTML = '';
    const n = A.length, m = B.length;
    DPTable(holder, st, {
      rows: n + 1, cols: m + 1, corner: '', rowHead: i => i === 0 ? '∅' : A[i - 1], colHead: j => j === 0 ? '∅' : B[j - 1],
      base: (i, j) => i === 0 || j === 0, baseVal: () => 0,
      calc: (i, j, g) => {
        if (A[i - 1] === B[j - 1]) { const d = g(i - 1, j - 1); return { v: d + 1, deps: [[i - 1, j - 1]], why: A[i - 1] + ' matches ' + B[j - 1] + ': diagonal ' + d + ' + 1 = ' + (d + 1) + '.' }; }
        const u = g(i - 1, j), l = g(i, j - 1);
        return { v: Math.max(u, l), deps: [[i - 1, j], [i, j - 1]], why: A[i - 1] + ' ≠ ' + B[j - 1] + ': max(above ' + u + ', left ' + l + ') = ' + Math.max(u, l) + '.' };
      },
      name: (i, j) => 'dp[' + i + '][' + j + '] (' + A[i - 1] + ' vs ' + B[j - 1] + ')',
      hint: (i, j) => A[i - 1] === B[j - 1] ? 'The letters match. Add 1 to the diagonal cell (up-left).' : 'The letters differ. Take the bigger of the cell above and the cell to the left.',
      trace: g => {
        let i = n, j = m; const cells = [], chars = [];
        while (i > 0 && j > 0) {
          if (A[i - 1] === B[j - 1]) { cells.push([i, j]); chars.push(A[i - 1]); i--; j--; }
          else if (g(i - 1, j) >= g(i, j - 1)) i--; else j--;
        }
        const word = chars.reverse().join('');
        return { cells, msg: word ? 'LCS = "' + word + '", length ' + g(n, m) + '. The highlighted cells are the matches found by walking back from the corner.' : 'No letters in common, so the LCS is empty.' };
      },
    });
  }
  build();
}

function vizKnapsack(host, st) {
  const ITEMS = [{ n: 'Tent', w: 3, v: 5 }, { n: 'Stove', w: 2, v: 3 }, { n: 'Camera', w: 1, v: 4 }, { n: 'Snacks', w: 2, v: 2 }];
  let W = 6;
  const wOut = h('strong', { class: 'big-num', style: 'font-size:22px;min-width:2.6em;text-align:center' });
  const holder = h('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  host.append(h('div', { class: 'setup' }, h('span', {}, 'Bag capacity'), btn('−', () => { if (W > 3) { W--; build(); } }), wOut, btn('+', () => { if (W < 8) { W++; build(); } })), holder);
  function build() {
    wOut.textContent = W + ' kg'; holder.innerHTML = '';
    const cards = ITEMS.map(it => h('div', { class: 'item' }, h('b', {}, it.n), h('span', {}, it.w + ' kg · ' + it.v + ' pts')));
    DPTable(holder, st, {
      rows: ITEMS.length + 1, cols: W + 1, corner: '', wideRows: true,
      rowHead: i => i === 0 ? 'no items' : '+ ' + ITEMS[i - 1].n + ' (' + ITEMS[i - 1].w + 'kg, ' + ITEMS[i - 1].v + ')',
      colHead: w => w + 'kg',
      base: i => i === 0, baseVal: () => 0,
      calc: (i, w, g) => {
        const it = ITEMS[i - 1], skip = g(i - 1, w);
        if (it.w > w) return { v: skip, deps: [[i - 1, w]], why: it.n + ' (' + it.w + ' kg) doesn\'t fit in ' + w + ' kg. Skip it: ' + skip + '.' };
        const rest = g(i - 1, w - it.w), take = it.v + rest, v = Math.max(skip, take);
        return { v, deps: [[i - 1, w], [i - 1, w - it.w]], why: 'Skip ' + it.n + ': ' + skip + '. Take it: ' + it.v + ' + best for ' + (w - it.w) + ' kg without it (' + rest + ') = ' + take + '. Best = ' + v + '.' };
      },
      name: (i, w) => 'dp[' + ITEMS[i - 1].n + '][' + w + 'kg]',
      hint: (i, w) => ITEMS[i - 1].w > w ? 'This item is too heavy for this column. Copy the cell above.' : 'Compare the cell above (skip) with this item\'s points plus the highlighted cell further left in the row above (take).',
      trace: g => {
        let i = ITEMS.length, w = W; const cells = [], taken = [];
        while (i > 0) { if (g(i, w) !== g(i - 1, w)) { taken.push(i - 1); cells.push([i, w]); w -= ITEMS[i - 1].w; } i--; }
        taken.reverse();
        const kg = taken.reduce((a, k) => a + ITEMS[k].w, 0);
        return { cells, taken, msg: 'Pack ' + taken.map(k => ITEMS[k].n).join(' + ') + ': ' + kg + ' kg, ' + g(ITEMS.length, W) + ' points. Highlighted cells are where taking the item won.' };
      },
      side: {
        el: h('div', { class: 'items' }, cards),
        focus(cur) { cards.forEach((c, k) => c.classList.toggle('cur', !!cur && cur[0] === k + 1)); },
        finish(tr) { cards.forEach((c, k) => c.classList.toggle('taken', tr.taken.includes(k))); },
        reset() { cards.forEach(c => c.classList.remove('taken')); },
      },
    });
  }
  build();
}

function vizPatterns(host, st) {
  const FAM = ['1D line', 'Unbounded choice', 'Grid', 'Two strings', 'Take or skip'];
  const PROBS = [
    { q: 'Minimum cost to climb stairs when each step has a cost to stand on it.', a: 0, why: 'The cost to reach step i depends on steps i−1 and i−2, just like Climbing Stairs.' },
    { q: 'Number of ways to make ₹50 from ₹1, ₹2 and ₹5 coins, using each coin as often as you like.', a: 1, why: 'Coins repeat, so it is Coin Change style: an unbounded choice.' },
    { q: 'Smallest sum along a path from the top-left to the bottom-right of a number grid, moving right or down.', a: 2, why: 'Each cell comes from above or from the left, just like Grid Paths.' },
    { q: 'Fewest edits (insert, delete, replace) to turn "horse" into "ros".', a: 3, why: 'Two strings, one along each side of a 2D table. This is Edit Distance.' },
    { q: 'Can [1, 5, 11, 5] be split into two groups with equal sums?', a: 4, why: 'Each number is in the subset or not: take or skip, like knapsack.' },
    { q: 'Most money from houses arranged in a circle, never robbing two neighbours.', a: 0, why: 'House Robber on a line, run twice: once without the first house, once without the last.' },
    { q: 'Fewest perfect squares (1, 4, 9, …) that add up to 12.', a: 1, why: 'Squares can repeat, exactly like coins.' },
    { q: 'Length of the longest palindromic subsequence of a string.', a: 3, why: 'Compare the string with its own reverse: LCS on two strings.' },
    { q: 'Number of routes through a field that avoid rocks, moving right or down.', a: 2, why: 'Grid Paths with blocked cells.' },
    { q: 'Pick tasks, each with hours and a reward, to earn the most within 8 hours. Each task can be done once.', a: 4, why: 'Weights (hours), values (reward), a capacity, each item once: 0/1 knapsack.' },
  ];
  let order = [], k = 0, score = 0, combo = 0, answered = false;
  const card = h('div', { class: 'pg-card' });
  host.append(h('p', { class: 'viz-note' }, 'Ten problems you haven\'t solved yet. Which DP family is each one? +5 XP for each first-time correct answer.'), card);
  function start() { order = shuffle(PROBS.map((_, i) => i)); k = 0; score = 0; combo = 0; show(); }
  function show() {
    card.innerHTML = ''; answered = false;
    if (k >= order.length) {
      card.append(h('div', { class: 'pg-top' }, h('span', {}, 'Result'), h('span', {}, score + ' / ' + order.length)),
        h('p', { class: 'pg-q' }, score >= 8 ? 'You can spot DP patterns. Pick any problem from "Try next" in the table above and solve it with the recipe.' : score >= 5 ? 'Good start. Re-read the family table above, then play once more.' : 'Read the family table above once more, then try again. It clicks faster than you think.'),
        h('div', { class: 'controls' }, btn('Play again', start, 'primary')));
      return;
    }
    const pi = order[k], p = PROBS[pi];
    const why = h('p', { class: 'why', hidden: true });
    const opts = h('div', { class: 'pg-opts' });
    const nextB = btn(k === order.length - 1 ? 'See result' : 'Next problem →', () => { k++; show(); }, 'primary');
    nextB.hidden = true;
    FAM.forEach((f, fi) => opts.append(h('button', { type: 'button', class: 'opt', onclick: () => {
      if (answered) return; answered = true;
      [...opts.children].forEach((b, i) => { b.disabled = true; if (i === p.a) b.classList.add('right'); else if (i === fi) b.classList.add('wrong'); });
      const right = fi === p.a;
      if (right) { score++; combo++; const key = st.id + ':g' + pi; if (!S.quiz[key]) gain(() => { S.quiz[key] = 1; }); } else combo = 0;
      why.hidden = false;
      why.innerHTML = (right ? '<strong>Correct' + (combo >= 3 ? ' · combo ×' + combo : '') + '.</strong> ' : '<strong>It is ' + esc(FAM[p.a]) + '.</strong> ') + esc(p.why);
      nextB.hidden = false; nextB.focus({ preventScroll: true });
    } }, f)));
    card.append(h('div', { class: 'pg-top' }, h('span', {}, 'Problem ' + (k + 1) + ' of ' + order.length), h('span', {}, 'Score ' + score)), h('p', { class: 'pg-q' }, p.q), opts, why, h('div', { class: 'controls', style: 'margin-top:12px' }, nextB));
  }
  start();
}
