<title>DSA Metro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Overpass:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a transit system. Home is the route map plus your metro card; every lesson is a station platform signed in its line colour. */
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface-2: #f4f6f8; --ink: #142030; --muted: #566475; --rule: #d2d9e1;
  --yellow: #f0b400; --blue: #1b5bbf; --red: #cf3a2f; --magenta: #b8186f;
  --on-yellow: #1c1500; --on-blue: #ffffff; --on-red: #ffffff; --on-magenta: #ffffff;
  --good: #157a3c; --good-soft: #def3e6; --bad: #b8322a; --bad-soft: #fbe4e1;
  --dep: #ffeaa8; --dep-line: #c99800;
  --card: #142030; --card-ink: #eef3f8; --card-muted: #a3b2c2;
  --tok-kw: #1b5bbf; --tok-str: #a4471b; --tok-num: #a3166a; --tok-com: #6c7a8a;
  --focus: #1b5bbf;
  --line: var(--ink); --on-line: var(--bg);
  --font-sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --font-body: "Overpass", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131a; --surface: #151d27; --surface-2: #1b2531; --ink: #e5ecf3; --muted: #93a2b2; --rule: #283544;
    --yellow: #f4c02e; --blue: #5b93ee; --red: #ef6a5e; --magenta: #e45ca3;
    --on-yellow: #1c1500; --on-blue: #08111c; --on-red: #1a0705; --on-magenta: #1a0510;
    --good: #52c785; --good-soft: #16321f; --bad: #f2857a; --bad-soft: #3a1e1c;
    --dep: #4a3d10; --dep-line: #d9b23a;
    --card: #1d2936; --card-ink: #eef3f8; --card-muted: #9fb0c1;
    --tok-kw: #82b1ff; --tok-str: #f2a47e; --tok-num: #f08fc4; --tok-com: #7f8fa1;
    --focus: #82b1ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --surface: #151d27; --surface-2: #1b2531; --ink: #e5ecf3; --muted: #93a2b2; --rule: #283544;
  --yellow: #f4c02e; --blue: #5b93ee; --red: #ef6a5e; --magenta: #e45ca3;
  --on-yellow: #1c1500; --on-blue: #08111c; --on-red: #1a0705; --on-magenta: #1a0510;
  --good: #52c785; --good-soft: #16321f; --bad: #f2857a; --bad-soft: #3a1e1c;
  --dep: #4a3d10; --dep-line: #d9b23a;
  --card: #1d2936; --card-ink: #eef3f8; --card-muted: #9fb0c1;
  --tok-kw: #82b1ff; --tok-str: #f2a47e; --tok-num: #f08fc4; --tok-com: #7f8fa1;
  --focus: #82b1ff;
  color-scheme: dark;
}
.l-yellow { --line: var(--yellow); --on-line: var(--on-yellow); }
.l-blue { --line: var(--blue); --on-line: var(--on-blue); }
.l-red { --line: var(--red); --on-line: var(--on-red); }
.l-magenta { --line: var(--magenta); --on-line: var(--on-magenta); }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 .3em; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 25px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .02em; }
.brand svg { width: 38px; height: 38px; flex: none; }
.stats { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; position: relative; }
.chip { font: 600 16px/1 var(--font-sign); letter-spacing: .02em; padding: 7px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 800; }
.xp-pop { position: absolute; left: 6px; top: -4px; font: 800 18px/1 var(--font-sign); color: var(--good); opacity: 0; pointer-events: none; }
.xp-pop.go { animation: pop 1.1s ease-out; }
@keyframes pop { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font: 600 15px/1 var(--font-sign); letter-spacing: .03em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 15px; line-height: 1.2; cursor: pointer; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 7px 12px; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.line { background: var(--line); color: var(--on-line); border-color: var(--line); }
.btn.ghost { background: transparent; }
.btn .sub { font: 600 13px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; opacity: .75; }

/* home */
.hero { padding-block: 40px 28px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 40px; align-items: start; }
.eyebrow { font: 700 15px/1.2 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; }
.hero h1 { font: 800 clamp(42px, 6.6vw, 76px)/.92 var(--font-sign); text-transform: uppercase; letter-spacing: -.005em; }
.hero h1 .dp { color: var(--magenta); }
.lede { font-size: 18px; max-width: 58ch; margin: 18px 0 24px; color: var(--ink); }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.cta { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 20px; border-radius: 10px; background: var(--line); color: var(--on-line); text-decoration: none; font: 700 24px/1.05 var(--font-sign); text-transform: uppercase; letter-spacing: .02em; }
.cta .sub { font: 600 13px/1 var(--font-sign); letter-spacing: .1em; opacity: .8; }
.cta:hover { filter: brightness(1.05); }
.cta-note { color: var(--muted); font-size: 15px; max-width: 34ch; }

.mcard { background: var(--card); color: var(--card-ink); border-radius: 16px; padding: 26px 22px 20px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(10, 20, 35, .18); }
.mstripes { position: absolute; inset: 0 0 auto 0; height: 8px; display: flex; }
.mstripes span { flex: 1; background: var(--line); }
.mc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.mc-brand { font: 700 14px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .14em; color: var(--card-muted); }
.mc-rank { font: 700 16px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .06em; }
.mc-bal { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
.mc-num { font: 800 64px/1 var(--font-sign); font-variant-numeric: tabular-nums; }
.mc-unit { font: 700 22px/1 var(--font-sign); color: var(--card-muted); }
.mc-next { font-size: 14px; color: var(--card-muted); margin-top: 4px; }
.mc-bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); margin-top: 8px; overflow: hidden; }
.mc-bar span { display: block; height: 100%; background: var(--yellow); border-radius: 3px; }
.mc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 18px 0 0; }
.mc-stats div { border-top: 1px solid rgba(255, 255, 255, .14); padding-top: 8px; }
.mc-stats dt { font: 600 12px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--card-muted); }
.mc-stats dd { margin: 4px 0 0; font: 700 22px/1 var(--font-sign); font-variant-numeric: tabular-nums; }
.mc-punch-label { font: 600 12px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--card-muted); margin-top: 18px; }
.punch { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
.punch i { aspect-ratio: 1; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .3); }
.punch i.on { background: var(--bg); border-color: var(--bg); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); }
.punch i.today { border-color: var(--yellow); border-width: 2px; }
.mc-eta { font-size: 14px; color: var(--card-ink); margin: 14px 0 0; }
.mc-eta b { color: var(--yellow); font-weight: 700; }
.mc-today { font-size: 13px; color: var(--card-muted); margin: 4px 0 0; }

.block { padding-block: 28px; }
.block-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.block h2 { font: 800 34px/1 var(--font-sign); text-transform: uppercase; }
.legend { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); display: inline-block; }
.map-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.metro-map { display: block; width: 100%; min-width: 760px; height: auto; }
.track { fill: none; stroke: var(--line); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.lane { fill: none; stroke: var(--magenta); stroke-width: 3.5; stroke-dasharray: 1 10; stroke-linecap: round; opacity: .7; }
.lane-label { font: italic 600 15px var(--font-sign); fill: var(--muted); letter-spacing: .03em; }
.stn .dot { fill: var(--surface); stroke: var(--line); stroke-width: 4; }
.stn .dot.inter { stroke: var(--ink); stroke-width: 3.5; }
.stn.done .dot { fill: var(--line); }
.stn .tick { fill: none; stroke: var(--on-line); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.stn text { font: 600 17px var(--font-sign); fill: var(--ink); letter-spacing: .01em; }
.stn text.term { font-weight: 800; font-size: 20px; text-transform: uppercase; }
.stn:hover text, .stn:focus text { text-decoration: underline; }
.stn .pulse { fill: none; stroke: var(--line); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

.rules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.rules div { padding: 16px 18px 4px 0; }
.rules h3 { font: 700 21px/1.1 var(--font-sign); text-transform: uppercase; letter-spacing: .01em; }
.rules p { color: var(--muted); font-size: 15px; margin: 6px 0 0; }

.lines { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.linecard { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; min-width: 0; }
.linecard header { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.roundel-sm { width: 34px; height: 34px; border-radius: 50%; background: var(--line); color: var(--on-line); display: grid; place-items: center; font: 800 18px/1 var(--font-sign); flex: none; }
.linecard h3 { font: 800 20px/1 var(--font-sign); text-transform: uppercase; }
.linecard header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.3; }
.vstrip { list-style: none; margin: 0; padding: 0; position: relative; }
.vstrip li { position: relative; padding-left: 28px; }
.vstrip li::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 6px; background: var(--line); }
.vstrip li:first-child::before { top: 50%; }
.vstrip li:last-child::before { bottom: 50%; }
.vstrip li:only-child::before { display: none; }
.vstrip li::after { content: ""; position: absolute; left: 2px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--surface); border: 3.5px solid var(--line); box-sizing: border-box; }
.vstrip li.done::after { background: var(--line); }
.vstrip li.next::after { box-shadow: 0 0 0 4px color-mix(in srgb, var(--line) 30%, transparent); }
.vstrip a { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; text-decoration: none; }
.vstrip a:hover .nm { text-decoration: underline; }
.vstrip .code { font: 700 13px/1 var(--font-sign); color: var(--muted); width: 22px; flex: none; }
.vstrip .nm { font-weight: 600; font-size: 15px; line-height: 1.25; min-width: 0; }
.vstrip .mins { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

footer.foot { padding-block: 28px 40px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--rule); margin-top: 24px; }
footer.foot p { margin: 4px 0; }

/* station */
.station { padding-block: 22px 10px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.sign { background: var(--line); color: var(--on-line); border-radius: 14px; padding: 22px 24px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; }
.roundel { width: 74px; height: 74px; border-radius: 50%; background: var(--surface); color: var(--ink); border: 6px solid var(--on-line); display: grid; place-items: center; font: 800 28px/1 var(--font-sign); }
.sign h1 { font: 800 clamp(36px, 6vw, 64px)/.95 var(--font-sign); text-transform: uppercase; letter-spacing: .005em; }
.sign .meta { font: 600 16px/1.3 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; margin-top: 8px; opacity: .85; }
.sign .towards { text-align: right; font: 700 15px/1.2 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; }
.sign .towards b { display: block; font-size: 24px; letter-spacing: .03em; }
.hstrip-box { overflow-x: auto; margin: 18px 0 6px; }
.hstrip { list-style: none; display: flex; margin: 0; padding: 0 0 4px; min-width: max-content; }
.hstrip li { position: relative; min-width: 104px; flex: 1; text-align: center; }
.hstrip li::before { content: ""; position: absolute; top: 9px; left: 0; right: 0; height: 6px; background: var(--line); }
.hstrip li:first-child::before { left: 50%; }
.hstrip li:last-child::before { right: 50%; }
.hstrip a { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; padding: 0 6px; font-size: 13px; color: var(--muted); }
.hstrip .d { position: relative; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 4px solid var(--line); }
.hstrip li.done .d { background: var(--line); }
.hstrip li.here .d { width: 24px; height: 24px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--line) 30%, transparent); }
.hstrip li.here a { color: var(--ink); font-weight: 700; }

.sec { padding-block: 30px; border-top: 1px solid var(--rule); }
.sec:first-of-type { border-top: 0; }
.sec > .eyebrow { margin-bottom: 6px; }
.sec h2 { font: 800 32px/1.05 var(--font-sign); text-transform: uppercase; margin-bottom: 14px; }
.story { font-size: 21px; line-height: 1.5; max-width: 62ch; margin: 0; }
.prose { max-width: 68ch; font-size: 17px; }
.prose p { margin: 0 0 14px; }
.prose ul { margin: 0 0 14px; padding-left: 22px; }
.prose li { margin-bottom: 6px; }
.prose .formula { font: 600 19px/1.4 var(--font-mono); background: var(--surface); border: 1px solid var(--rule); border-left: 0; border-radius: 8px; padding: 12px 16px; display: inline-block; }
.prose .note { background: color-mix(in srgb, var(--line) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--line) 40%, var(--rule)); border-radius: 8px; padding: 12px 16px; }
.tbl-scroll { overflow-x: auto; margin: 0 0 14px; }
.tbl { border-collapse: collapse; font-size: 15px; min-width: 320px; }
.tbl th, .tbl td { text-align: left; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font: 700 14px/1.2 var(--font-sign); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tbl td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.viz { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.viz-note { color: var(--muted); font-size: 15px; margin: 0; }
.setup { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.setup label { font-weight: 600; }
.setup select, .setup input[type=text], .setup input[type=number] { border: 1px solid var(--rule); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.setup input[type=text] { width: 9.5em; text-transform: uppercase; font-family: var(--font-mono); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.step-count { font-size: 14px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.msg { font-size: 16px; min-height: 1.6em; margin: 0; }
.msg.good { color: var(--good); font-weight: 600; }
.msg.bad { color: var(--bad); font-weight: 600; }
.svg-scroll { overflow-x: auto; }
.svg-scroll svg { display: block; margin: 0 auto; }

/* arrays */
.arr { display: flex; gap: 6px; flex-wrap: wrap; }
.cell { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cell .box { width: 48px; height: 48px; display: grid; place-items: center; border: 2px solid var(--rule); border-radius: 8px; background: var(--surface-2); font: 600 18px/1 var(--font-mono); transition: all .2s; }
.cell .ix { font: 12px/1 var(--font-mono); color: var(--muted); }
.cell .ptr { font: 700 14px/1 var(--font-sign); height: 16px; color: var(--line); letter-spacing: .05em; }
.cell.gone .box { opacity: .3; }
.cell.on .box { border-color: var(--line); background: color-mix(in srgb, var(--line) 16%, var(--surface)); }
.cell.hit .box { border-color: var(--good); background: var(--good-soft); }

/* big-o */
.bo-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.bo-n { font: 800 34px/1 var(--font-sign); min-width: 5.5em; font-variant-numeric: tabular-nums; }
.bo-head input[type=range] { flex: 1; min-width: 180px; accent-color: var(--line); }
.bo-rows { display: grid; gap: 10px; }
.bo-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 150px 150px; gap: 12px; align-items: center; font-size: 14px; }
.bo-name { font: 700 18px/1 var(--font-mono); }
.bo-name small { display: block; font: 12px/1.3 var(--font-body); color: var(--muted); margin-top: 3px; }
.bo-track { position: relative; height: 18px; background: var(--surface-2); border-radius: 4px; }
.bo-fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--good); transition: width .25s, background .25s; }
.bo-fill.slow { background: var(--bad); }
.bo-limit { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--ink); opacity: .5; }
.bo-ops { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font: 700 13px/1.2 var(--font-sign); text-transform: uppercase; letter-spacing: .06em; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.bo-time { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }

/* recursion stack */
.stack { display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
.frame { border: 2px solid var(--rule); border-radius: 8px; padding: 8px 12px; font: 15px/1.3 var(--font-mono); background: var(--surface-2); display: flex; justify-content: space-between; gap: 10px; }
.frame.top { border-color: var(--line); background: color-mix(in srgb, var(--line) 14%, var(--surface)); }
.frame.ret { border-color: var(--good); }
.frame .tag { font: 700 12px/1.4 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stack-label { font: 700 13px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

/* guess */
.gtrack { position: relative; height: 34px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.grange { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--line) 35%, var(--surface)); transition: left .35s, width .35s; }
.gmark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.gscale { display: flex; justify-content: space-between; font: 12px var(--font-mono); color: var(--muted); }
.glog { display: flex; gap: 6px; flex-wrap: wrap; }
.glog span { font: 13px/1 var(--font-mono); padding: 5px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--rule); }
.glog span.lo::after { content: " ↑"; }
.glog span.hi::after { content: " ↓"; }
.glog span.ok { background: var(--good-soft); border-color: var(--good); }
.big-num { font: 800 28px/1 var(--font-sign); font-variant-numeric: tabular-nums; }

/* sort race */
.race { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.racer h3 { font: 700 18px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; }
.racer h3 span { font-family: var(--font-mono); font-size: 14px; text-transform: none; color: var(--muted); font-weight: 400; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 150px; margin-top: 10px; background: var(--surface-2); border-radius: 6px; padding: 6px; }
.bars i { flex: 1; background: color-mix(in srgb, var(--line) 55%, var(--surface)); border-radius: 2px 2px 0 0; min-width: 0; }
.bars i.hi { background: var(--ink); }
.bars.done i { background: var(--good); }

/* brackets */
.chars { display: flex; gap: 4px; flex-wrap: wrap; font: 600 22px/1 var(--font-mono); }
.chars span { width: 34px; height: 40px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--rule); }
.chars span.past { opacity: .4; }
.chars span.now { border: 2px solid var(--line); background: color-mix(in srgb, var(--line) 16%, var(--surface)); opacity: 1; }
.hstack { display: flex; gap: 4px; align-items: center; min-height: 44px; flex-wrap: wrap; }
.hstack span { width: 38px; height: 40px; display: grid; place-items: center; font: 600 20px/1 var(--font-mono); border-radius: 6px; background: color-mix(in srgb, var(--line) 22%, var(--surface)); border: 2px solid var(--line); }
.hstack span.top { box-shadow: 0 0 0 3px color-mix(in srgb, var(--line) 30%, transparent); }
.hstack span.bad { border-color: var(--bad); background: var(--bad-soft); }
.hstack em { color: var(--muted); font-size: 14px; }

/* hash */
.hash-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; align-items: start; }
.maptbl { border-collapse: collapse; font: 15px var(--font-mono); width: 100%; }
.maptbl th { font: 700 13px var(--font-sign); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: left; padding: 4px 8px; }
.maptbl td { padding: 6px 8px; border-top: 1px solid var(--rule); }
.maptbl tr.hit td { background: var(--good-soft); }
.need { font: 600 16px var(--font-mono); }

/* linked list */
.ll { display: flex; align-items: center; gap: 0; min-width: max-content; padding: 6px 2px; }
.ll .node { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ll .nbox { width: 48px; height: 48px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 8px; font: 600 18px var(--font-mono); background: var(--surface); }
.ll .nbox.null { border-style: dashed; border-color: var(--rule); color: var(--muted); font-size: 13px; }
.ll .lab { font: 700 13px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .05em; height: 30px; text-align: center; color: var(--line); display: flex; flex-direction: column; gap: 2px; }
.ll .lnk { width: 34px; text-align: center; font: 600 22px/1 var(--font-mono); color: var(--ink); margin-bottom: 36px; }
.ll .lnk.back { color: var(--line); }

/* tree */
.trav-out { display: flex; gap: 6px; flex-wrap: wrap; min-height: 36px; align-items: center; }
.trav-out span { font: 600 15px/1 var(--font-mono); padding: 8px 10px; border-radius: 6px; background: color-mix(in srgb, var(--line) 18%, var(--surface)); }
.trav-out em, .q-row em { color: var(--muted); font-size: 14px; }
.q-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font: 14px var(--font-mono); }
.q-row span { padding: 5px 8px; border: 1px dashed var(--muted); border-radius: 6px; }
.tnode circle { fill: var(--surface); stroke: var(--line); stroke-width: 3; transition: fill .2s; }
.tnode text { font: 600 16px var(--font-mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.tnode.seen circle { fill: color-mix(in srgb, var(--line) 30%, var(--surface)); }
.tnode.cur circle { fill: var(--line); }
.tnode.cur text { fill: var(--on-line); }
.tedge { stroke: var(--rule); stroke-width: 3; }

/* grid maze */
.maze { display: grid; gap: 2px; max-width: 600px; width: 100%; user-select: none; }
.maze div { aspect-ratio: 1; background: var(--surface-2); border-radius: 3px; cursor: pointer; transition: background .15s; }
.maze div.wall { background: var(--ink); }
.maze div.seen { background: color-mix(in srgb, var(--line) 30%, var(--surface)); }
.maze div.path { background: var(--line); }
.maze div.start, .maze div.goal { background: var(--good); cursor: default; }
.maze div.goal { background: var(--yellow); }
.maze-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.maze-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* fib tree */
.fn circle { fill: var(--surface); stroke: var(--muted); stroke-width: 2; transition: fill .2s, stroke .2s; }
.fn text { font: 600 12px var(--font-mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.fn { opacity: 0; transition: opacity .2s; }
.fn.shown { opacity: 1; }
.fn.active circle { stroke: var(--magenta); stroke-width: 3.5; }
.fn.fresh circle { fill: color-mix(in srgb, var(--magenta) 24%, var(--surface)); stroke: var(--magenta); }
.fn.waste circle { fill: var(--bad-soft); stroke: var(--bad); }
.fn.hit circle { fill: var(--good-soft); stroke: var(--good); stroke-dasharray: 4 3; }
.fe { stroke: var(--rule); stroke-width: 2; opacity: 0; transition: opacity .2s; }
.fe.shown { opacity: 1; }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.key i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; border: 2px solid; }
.key .k-fresh { background: color-mix(in srgb, var(--magenta) 24%, var(--surface)); border-color: var(--magenta); }
.key .k-waste { background: var(--bad-soft); border-color: var(--bad); }
.key .k-hit { background: var(--good-soft); border-color: var(--good); border-style: dashed; }
.fib-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.fib-stats div { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-sign); font-weight: 600; }
.fib-stats b { display: block; font: 800 30px/1 var(--font-sign); color: var(--ink); font-variant-numeric: tabular-nums; }
.tally { display: grid; gap: 4px; max-width: 520px; }
.tally div { display: grid; grid-template-columns: 64px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font: 13px var(--font-mono); }
.tally i { height: 12px; border-radius: 3px; background: var(--bad); display: block; min-width: 2px; transition: width .2s; }
.tally i.once { background: var(--good); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .sw { width: 42px; height: 24px; border-radius: 12px; background: var(--rule); position: relative; transition: background .2s; flex: none; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: left .2s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.switch input:checked + .sw { background: var(--good); }
.switch input:checked + .sw::after { left: 21px; }
.switch input:focus-visible + .sw { outline: 3px solid var(--focus); outline-offset: 2px; }

/* DP table */
.dp-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.dp-meta { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.combo { font: 800 18px/1 var(--font-sign); color: var(--line); text-transform: uppercase; letter-spacing: .04em; }
.combo.bump { animation: bump .35s; }
@keyframes bump { 50% { transform: scale(1.25); } }
.dp-scroll { overflow-x: auto; max-width: 100%; padding: 4px; }
table.dp { border-collapse: separate; border-spacing: 4px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dp th { font: 600 13px/1.2 var(--font-mono); color: var(--muted); padding: 2px 6px; text-align: center; white-space: nowrap; }
.dp th.rowh { text-align: right; }
.dp th.rowh.wide { white-space: normal; min-width: 96px; max-width: 140px; font-family: var(--font-body); font-size: 13px; line-height: 1.25; }
.dp td { width: 48px; min-width: 48px; height: 44px; text-align: center; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--rule); font-size: 16px; font-weight: 600; padding: 0; transition: background .2s, border-color .2s; }
.dp td.base { background: var(--surface); color: var(--muted); }
.dp td.filled { background: color-mix(in srgb, var(--line) 18%, var(--surface)); border-color: color-mix(in srgb, var(--line) 50%, var(--rule)); }
.dp td.dep { background: var(--dep); border-color: var(--dep-line); border-width: 2px; }
.dp td.cur { outline: 3px solid var(--line); outline-offset: 1px; background: var(--surface); }
.dp td.path { background: var(--line); color: var(--on-line); border-color: var(--line); }
.dp td.blocked { background: repeating-linear-gradient(45deg, var(--surface-2) 0 5px, var(--rule) 5px 10px); color: var(--muted); }
.dp td.start { box-shadow: inset 0 0 0 2px var(--good); }
.dp td.goal { box-shadow: inset 0 0 0 2px var(--yellow); }
.dp td.clickable { cursor: pointer; }
.dp td.clickable:hover { border-color: var(--ink); }
.dp td input { width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font: 600 16px var(--font-mono); padding: 0; outline: none; }
.dp td.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.dp-status { font-size: 16px; min-height: 3.2em; }
.dp-status p { margin: 0 0 4px; }
.dp-status .good { color: var(--good); font-weight: 600; }
.dp-status .bad { color: var(--bad); font-weight: 600; }
.dp-status .next { color: var(--muted); font-size: 15px; }
.stairs { display: flex; align-items: flex-end; gap: 3px; height: 100px; }
.stair { flex: 1; max-width: 56px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 4px 4px 0 0; display: flex; align-items: flex-start; justify-content: center; font: 12px var(--font-mono); color: var(--muted); padding-top: 2px; transition: background .2s; }
.stair.cur { background: var(--line); color: var(--on-line); border-color: var(--line); }
.stair.dep { background: var(--dep); border-color: var(--dep-line); }
.street { display: flex; gap: 8px; flex-wrap: wrap; }
.house { width: 64px; display: flex; flex-direction: column; align-items: center; }
.house .roof { width: 0; height: 0; border-left: 32px solid transparent; border-right: 32px solid transparent; border-bottom: 22px solid var(--rule); transition: border-color .2s; }
.house .body { width: 54px; height: 44px; background: var(--surface-2); border: 2px solid var(--rule); border-top: 0; display: grid; place-items: center; font: 600 15px var(--font-mono); transition: all .2s; }
.house .hl { font: 700 12px var(--font-sign); color: var(--muted); margin-top: 4px; letter-spacing: .05em; }
.house.cur .roof { border-bottom-color: var(--line); }
.house.cur .body { border-color: var(--line); }
.house.robbed .roof { border-bottom-color: var(--good); }
.house.robbed .body { background: var(--good-soft); border-color: var(--good); }
.items { display: flex; gap: 8px; flex-wrap: wrap; }
.item { border: 2px solid var(--rule); border-radius: 8px; padding: 8px 12px; background: var(--surface-2); min-width: 110px; transition: all .2s; }
.item b { display: block; font: 700 17px/1.1 var(--font-sign); text-transform: uppercase; letter-spacing: .03em; }
.item span { font: 13px var(--font-mono); color: var(--muted); }
.item.cur { border-color: var(--line); }
.item.taken { border-color: var(--good); background: var(--good-soft); }
.coins { display: flex; gap: 8px; }
.coin { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-mono); background: color-mix(in srgb, var(--yellow) 45%, var(--surface)); border: 2px solid var(--dep-line); }

/* pattern game */
.pg-card { border: 2px solid var(--rule); border-radius: 12px; padding: 18px; background: var(--surface-2); }
.pg-top { display: flex; justify-content: space-between; gap: 10px; font: 700 14px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
.pg-q { font-size: 19px; line-height: 1.45; margin: 0 0 16px; }
.pg-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }

/* code */
.codebox { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--surface); }
.codebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--rule); background: var(--surface-2); }
.codebar .lab { font: 700 14px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.codebox pre { margin: 0; padding: 16px 18px; overflow-x: auto; font: 14px/1.6 var(--font-mono); tab-size: 4; }
.t-kw { color: var(--tok-kw); font-weight: 600; }
.t-str { color: var(--tok-str); }
.t-num { color: var(--tok-num); }
.t-com { color: var(--tok-com); font-style: italic; }

/* quiz */
.quiz { display: grid; gap: 16px; max-width: 760px; }
.q { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; background: var(--surface); }
.qq { font-size: 17px; font-weight: 600; margin: 0 0 12px; display: flex; gap: 10px; }
.qn { font: 800 17px/1.5 var(--font-sign); color: var(--line); flex: none; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--rule); background: var(--surface-2); padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1.4; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.why { margin: 12px 0 0; font-size: 15px; color: var(--ink); }

/* practice */
.probs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; max-width: 820px; }
.probs > li { border-bottom: 1px solid var(--rule); padding: 12px 0; }
.prow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prow input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--good); flex: none; cursor: pointer; margin: 0; }
.prow a.pt { font-weight: 600; font-size: 17px; min-width: 0; }
.prow a.pt.solved { text-decoration-color: var(--good); color: var(--muted); }
.diff { font: 700 12px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; border-radius: 999px; }
.d-easy { background: var(--good-soft); color: var(--good); }
.d-medium { background: color-mix(in srgb, var(--yellow) 30%, var(--surface)); color: var(--ink); }
.prow .grow { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.xp-tag { font: 700 13px/1 var(--font-sign); color: var(--muted); letter-spacing: .05em; }
.hints { margin: 10px 0 0 34px; display: grid; gap: 8px; }
.hint { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; font-size: 15px; }
.hint b { font: 700 13px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .08em; color: var(--line); display: block; margin-bottom: 4px; }

/* doubt */
.doubt { display: grid; gap: 12px; max-width: 820px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chips button:hover { border-color: var(--ink); }
.ask-row { display: flex; gap: 8px; align-items: flex-end; }
.ask-row textarea { flex: 1; min-width: 0; min-height: 52px; resize: vertical; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 16px; line-height: 1.4; }
.log { display: grid; gap: 10px; }
.msgb { border-radius: 12px; padding: 12px 16px; font-size: 16px; line-height: 1.55; min-width: 0; }
.msgb.you { background: var(--surface-2); justify-self: end; max-width: 85%; }
.msgb.bot { background: var(--surface); border: 1px solid var(--rule); }
.msgb.bot p { margin: 0 0 10px; }
.msgb.bot p:last-child { margin-bottom: 0; }
.msgb.bot ul, .msgb.bot ol { margin: 0 0 10px; padding-left: 22px; }
.msgb.bot .codebox { margin: 0 0 10px; }
.thinking { color: var(--muted); font-style: italic; }
.err { color: var(--bad); }

/* finish */
.finish { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 22px 0; border-top: 1px solid var(--rule); }
.finish .done-note { font: 700 20px/1.2 var(--font-sign); text-transform: uppercase; letter-spacing: .03em; color: var(--good); margin: 0; }
.finish .nav { display: flex; gap: 10px; flex-wrap: wrap; }
.nextbtn { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 18px; border-radius: 10px; background: var(--ink); color: var(--bg); text-decoration: none; font: 700 21px/1.05 var(--font-sign); text-transform: uppercase; letter-spacing: .02em; }
.nextbtn .sub { font: 600 12px/1 var(--font-sign); letter-spacing: .1em; opacity: .75; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font: 700 17px/1.2 var(--font-sign); letter-spacing: .04em; text-transform: uppercase; z-index: 20; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); text-align: center; }
.toast.show { animation: toastin .25s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 10px); } }

/* main nav */
.mainnav { display: flex; gap: 2px; }
.mainnav a { font: 700 16px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .06em; text-decoration: none; padding: 9px 10px 6px; color: var(--muted); border-bottom: 3px solid transparent; }
.mainnav a:hover { color: var(--ink); }
.mainnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

/* study guide */
.guide-hero { padding-block: 36px 4px; }
.guide-hero h1 { font: 800 clamp(38px, 6vw, 66px)/.95 var(--font-sign); text-transform: uppercase; max-width: 24ch; }
.levels, .guide-promo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.lvl { text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--rule); border-radius: 12px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-decoration: none; min-width: 0; }
.lvl:hover { border-color: var(--line); }
.lvl[aria-selected="true"] { border-color: var(--line); box-shadow: 0 0 0 3px color-mix(in srgb, var(--line) 28%, transparent); }
.lv-k { font: 700 13px/1 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.lv-k i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.lv-n { font: 800 28px/1 var(--font-sign); text-transform: uppercase; }
.lv-t { font-size: 14px; color: var(--muted); }
.lv-bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.lv-bar span { display: block; height: 100%; width: 0; background: var(--line); }
.lv-p { font: 13px/1.3 var(--font-mono); color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 22px; margin-top: 14px; display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.panel-h { font: 800 26px/1.05 var(--font-sign); text-transform: uppercase; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.facts .wide { grid-column: span 2; }
.facts p { margin: 0; font-size: 15px; }

<p>In real code, use the built-in sort: <code>sort(a.begin(), a.end())</code> in C++ or <code>a.sort()</code> in Python, both O(n log n). Learn merge sort anyway. The merge step shows up on its own in many problems, and "sort first, then use two pointers" is one of the most common patterns there is.</p>`,

    if (lo >= hi) return;
    int mid = (lo + hi) / 2;
    mergeSort(a, lo, mid);
    mergeSort(a, mid + 1, hi);
    vector<int> tmp;                     // merge the two sorted halves
    int i = lo, j = mid + 1;
    while (i <= mid && j <= hi)
        tmp.push_back(a[i] <= a[j] ? a[i++] : a[j++]);
    while (i <= mid) tmp.push_back(a[i++]);
    while (j <= hi) tmp.push_back(a[j++]);

<p>In C++: <code>stack&lt;int&gt;</code> and <code>queue&lt;int&gt;</code>. In Python, a plain list works as a stack (<code>append</code>, <code>pop</code>); use <code>collections.deque</code> for a queue.</p>

  code: {
    cpp: `bool isValid(string s) {
    stack<char> st;
    for (char c : s) {
        if (c == '(' || c == '[' || c == '{') { st.push(c); continue; }
        if (st.empty()) return false;              // closer with nothing open
        char open = st.top(); st.pop();
        if ((c == ')' && open != '(') ||
            (c == ']' && open != '[') ||
            (c == '}' && open != '{')) return false;   // wrong pair
    }
    return st.empty();                             // everything closed?
}`,

  idea: `<p>A <strong>linked list</strong> is a chain of nodes. Each node holds a value and a pointer to the next node. The last node points to null.</p>
<ul><li>Inserting or deleting at a node you already hold is O(1): you only change pointers.</li><li>Reaching the k-th node is O(n): you have to walk there.</li><li>Almost every problem is pointer juggling. Draw boxes and arrows on paper before you code.</li></ul>
<p>Reversing a list uses three pointers: <code>prev</code>, <code>curr</code> and <code>next</code>. Save the rest of the list, flip one arrow, step forward. Two more tricks to know: a <strong>dummy head</strong> node removes special cases, and <strong>fast and slow pointers</strong> (one moves 2 steps, the other 1) find the middle or detect a cycle.</p>`,
  vizTitle: 'Reverse a linked list', viz: vizLinked,
  code: {
    cpp: `struct ListNode { int val; ListNode* next; };

ListNode* reverseList(ListNode* head) {
    ListNode* prev = nullptr;
    ListNode* curr = head;
    while (curr) {
        ListNode* nxt = curr->next;   // 1. save the rest of the list
        curr->next = prev;            // 2. flip the arrow
        prev = curr;                  // 3. move both pointers forward
        curr = nxt;
    }
    return prev;                      // the new head
}`,

  idea: `<p>In a <strong>binary tree</strong> each node has at most two children, left and right. In a <strong>binary search tree (BST)</strong>, everything on the left of a node is smaller than it and everything on the right is bigger.</p>
<p>Most tree problems follow one shape: <strong>solve the left subtree, solve the right subtree, combine</strong>. That is recursion. Max depth is <code>1 + max(depth(left), depth(right))</code>, and an empty tree has depth 0.</p>
<p>The four ways to walk a tree:</p>
<ul><li><strong>Preorder</strong>: node, left, right. Good for copying a tree.</li><li><strong>Inorder</strong>: left, node, right. On a BST it gives the values in sorted order.</li><li><strong>Postorder</strong>: left, right, node. Use it when children must be finished first, like freeing memory.</li><li><strong>Level order</strong>: row by row, using a queue. This is BFS.</li></ul>`,

  code: {
    cpp: `struct TreeNode { int val; TreeNode *left, *right; };

int maxDepth(TreeNode* root) {

}

    inorder(root->left, out);    // left
    out.push_back(root->val);    // node
    inorder(root->right, out);   // right
}`,

  idea: `<p>A <strong>graph</strong> is a set of nodes and the edges between them. Store it as an <strong>adjacency list</strong>: for each node, a list of its neighbours. A grid is a graph too: each cell connects to the cells above, below, left and right.</p>
<ul><li><strong>BFS</strong> (breadth-first search) explores in rings using a queue. The first time BFS reaches a cell, it has found the shortest path to it, as long as every step costs the same.</li><li><strong>DFS</strong> (depth-first search) goes as deep as it can before backing up, using recursion or a stack. Great for "count the islands" or "is everything connected?", but not for shortest paths.</li><li>Always keep a <strong>visited</strong> set. Without it you go around in circles forever.</li></ul>
<p>Both run in O(V + E): every node and every edge is handled once.</p>`,
  vizTitle: 'BFS vs DFS in a maze', viz: vizMaze,
  code: {
    cpp: `// Fewest steps from (sr, sc) to (tr, tc). '#' is a wall.
int bfs(vector<string>& g, int sr, int sc, int tr, int tc) {
    int R = g.size(), C = g[0].size();
    vector<vector<int>> dist(R, vector<int>(C, -1));
    queue<pair<int, int>> q;
    q.push({sr, sc}); dist[sr][sc] = 0;
    int dr[] = {-1, 1, 0, 0}, dc[] = {0, 0, -1, 1};
    while (!q.empty()) {
        auto [r, c] = q.front(); q.pop();
        if (r == tr && c == tc) return dist[r][c];
        for (int k = 0; k < 4; k++) {
            int nr = r + dr[k], nc = c + dc[k];
            if (nr < 0 || nc < 0 || nr >= R || nc >= C) continue;
            if (g[nr][nc] == '#' || dist[nr][nc] != -1) continue;
            dist[nr][nc] = dist[r][c] + 1;   // mark visited when you push
            q.push({nr, nc});
        }
    }
    return -1;                               // unreachable
}`,
    py: `from collections import deque

# Fewest steps from (sr, sc) to (tr, tc). '#' is a wall.
def bfs(g, sr, sc, tr, tc):
    R, C = len(g), len(g[0])
    dist = [[-1] * C for _ in range(R)]
    dist[sr][sc] = 0
    q = deque([(sr, sc)])
    while q:
        r, c = q.popleft()
        if (r, c) == (tr, tc):
            return dist[r][c]
        for dr, dc in ((-1, 0), (1, 0), (0, -1), (0, 1)):
            nr, nc = r + dr, c + dc
            if 0 <= nr < R and 0 <= nc < C and g[nr][nc] != '#' and dist[nr][nc] == -1:
                dist[nr][nc] = dist[r][c] + 1   # mark visited when you push
                q.append((nr, nc))
    return -1                                   # unreachable`,
  },

  id: 'fibonacci', line: 'magenta', name: 'Why DP? Fibonacci', short: 'Fibonacci', mins: 30,
  story: 'Ask a friend what 17 × 23 is. They work it out: 391. Ask again a minute later and they just remember it. Plain recursion never remembers. It recomputes the same thing again and again, and that is why it is slow.',
  idea: `<p>Fibonacci: <code>fib(n) = fib(n−1) + fib(n−2)</code>, with <code>fib(0) = 0</code> and <code>fib(1) = 1</code>. Written as plain recursion, <code>fib(40)</code> makes over <strong>33 crore</strong> calls (331 million), because the same small values are recomputed over and over. Play with the tree below to see it happen.</p>
<p><strong>Dynamic programming (DP)</strong> fixes this by saving answers. It works when a problem has:</p>
<ul><li><strong>Overlapping subproblems</strong>: the same smaller problem comes up many times.</li><li><strong>Optimal substructure</strong>: the answer can be built from the answers to smaller problems.</li></ul>
<p>There are two ways to write it:</p>
<ul><li><strong>Memoization (top-down)</strong>: keep the recursion, but store each answer the first time and return the stored answer on every later call.</li><li><strong>Tabulation (bottom-up)</strong>: fill an array from the smallest case up, <code>dp[i] = dp[i−1] + dp[i−2]</code>. No recursion at all.</li></ul>
<p>Both make Fibonacci O(n). <code>fib(40)</code> drops from 331 million calls to 79.</p>`,
  vizTitle: 'The recursion tree, with and without memo', viz: vizFib,
  code: {
    cpp: `// 1. Plain recursion: O(2^n). Recomputes the same values.
long long fib(int n) {
    if (n <= 1) return n;
    return fib(n - 1) + fib(n - 2);
}

// 2. Memoization (top-down): O(n). Remember each answer.
vector<long long> memo(91, -1);
long long fibMemo(int n) {
    if (n <= 1) return n;
    if (memo[n] != -1) return memo[n];            // already solved
    return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);
}

// 3. Tabulation (bottom-up): O(n). Fill from small to big.
long long fibTab(int n) {
    if (n <= 1) return n;
    vector<long long> dp(n + 1);
    dp[0] = 0; dp[1] = 1;
    for (int i = 2; i <= n; i++) dp[i] = dp[i - 1] + dp[i - 2];
    return dp[n];
}`,
    py: `# 1. Plain recursion: O(2^n). Recomputes the same values.
def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)

# 2. Memoization (top-down): O(n). Remember each answer.
memo = {}
def fib_memo(n):
    if n <= 1:
        return n
    if n not in memo:                       # solve it only once
        memo[n] = fib_memo(n - 1) + fib_memo(n - 2)
    return memo[n]

# 3. Tabulation (bottom-up): O(n). Fill from small to big.
def fib_tab(n):
    if n <= 1:
        return n
    dp = [0] * (n + 1)
    dp[1] = 1
    for i in range(2, n + 1):
        dp[i] = dp[i - 1] + dp[i - 2]
    return dp[n]`,
  },

{
  id: 'climbing-stairs', line: 'magenta', name: 'Climbing Stairs', short: 'Climbing Stairs', mins: 25,
  story: 'The stairs to the top floor of your college block: you take 1 or 2 steps at a time. In how many different ways can you reach step n? Counting by hand stops working around n = 6.',
  idea: `<p>Think about the <strong>last move</strong>. To stand on step <code>i</code>, you either stepped up 1 from step <code>i−1</code>, or 2 from step <code>i−2</code>. So:</p>
<p class="formula">ways(i) = ways(i−1) + ways(i−2)</p>
<p>with <code>ways(0) = 1</code> (stand still) and <code>ways(1) = 1</code>.</p>
<p>That is the whole <strong>DP recipe</strong>, and every station from here to the terminus uses it:</p>
<ul><li><strong>State</strong>: what one cell means. Here, ways(i) is the number of ways to reach step i.</li><li><strong>Transition</strong>: how a cell is built from smaller cells. Here, from i−1 and i−2.</li><li><strong>Base cases</strong>: cells you know without calculating.</li><li><strong>Answer</strong>: the cell you want. Here, ways(n).</li></ul>
<p>In the table below you fill each cell yourself. Get it right on the first try for XP.</p>`,
  vizTitle: 'Fill the table', viz: vizStairs,
  code: {
    cpp: `int climbStairs(int n) {
    if (n <= 1) return 1;
    vector<int> ways(n + 1);
    ways[0] = 1;                 // one way to stay on the ground
    ways[1] = 1;                 // a single 1-step
    for (int i = 2; i <= n; i++)
        ways[i] = ways[i - 1] + ways[i - 2];   // last move was 1 or 2 steps
    return ways[n];
}`,
    py: `def climb_stairs(n):

    for i in range(2, n + 1):

    return ways[n]`,
  },

  story: 'A thief walks down a street of houses, each with some cash inside. Rob two houses next to each other and the alarm goes off. What is the most cash they can take in one night?',
  idea: `<p>Same recipe, but now every step is a <strong>choice</strong>.</p>
<ul><li><strong>State</strong>: dp[k] is the most cash from the first k houses.</li><li><strong>Transition</strong>: at house k, either skip it (keep dp[k−1]) or rob it (its cash + dp[k−2], because the neighbour must be skipped). Take the bigger.</li><li><strong>Base</strong>: dp[0] = 0. No houses, no cash.</li><li><strong>Answer</strong>: dp[n].</li></ul>
<p class="formula">dp[k] = max(dp[k−1], cash[k] + dp[k−2])</p>
<p>Greedy ideas like "always rob the richest house" fail here. DP wins because it weighs both choices at every house without trying every combination.</p>`,
  vizTitle: 'Rob the street', viz: vizRobber,
  code: {
    cpp: `int rob(vector<int>& cash) {
    int n = cash.size();
    vector<int> dp(n + 1, 0);       // dp[k] = best from the first k houses
    dp[1] = cash[0];
    for (int k = 2; k <= n; k++) {
        int skip = dp[k - 1];                 // leave house k alone
        int take = cash[k - 1] + dp[k - 2];   // rob it, skip its neighbour
        dp[k] = max(skip, take);
    }
    return dp[n];
}`,

    dp = [0] * (n + 1)             # dp[k] = best from the first k houses

    return dp[n]`,

  id: 'coin-change', line: 'magenta', name: 'Coin Change', short: 'Coin Change', mins: 35,
  story: 'You are at the canteen counter with ₹1, ₹3 and ₹4 coins and need to give ₹6 change using as few coins as possible. Greedy grabs the biggest coin first: 4 + 1 + 1, three coins. The real answer is 3 + 3, two coins.',
  idea: `<ul><li><strong>State</strong>: dp[a] is the fewest coins that make amount a.</li><li><strong>Transition</strong>: the last coin used was some coin c. Try each one: dp[a] = min over coins of dp[a − c] + 1.</li><li><strong>Base</strong>: dp[0] = 0. Amounts you can't make stay at ∞.</li><li><strong>Answer</strong>: dp[amount], or −1 if it is still ∞.</li></ul>
<p>Unlike House Robber, one cell can read many earlier cells, one per coin. And each coin can be used again and again. That is an <strong>unbounded</strong> choice, and it is why we read from the same row instead of a "previous item" row.</p>
<p>In the table, type <code>inf</code> for ∞.</p>`,
  vizTitle: 'Make change', viz: vizCoins,
  code: {
    cpp: `int coinChange(vector<int>& coins, int amount) {
    const int INF = 1e9;
    vector<int> dp(amount + 1, INF);   // dp[a] = fewest coins for amount a
    dp[0] = 0;
    for (int a = 1; a <= amount; a++)
        for (int c : coins)
            if (c <= a && dp[a - c] != INF)
                dp[a] = min(dp[a], dp[a - c] + 1);   // use coin c last
    return dp[amount] == INF ? -1 : dp[amount];
}`,
    py: `def coin_change(coins, amount):
    INF = float('inf')
    dp = [0] + [INF] * amount          # dp[a] = fewest coins for amount a
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a:
                dp[a] = min(dp[a], dp[a - c] + 1)   # use coin c last
    return -1 if dp[amount] == INF else dp[amount]`,

  idea: `<p>Your first <strong>2D DP</strong>: the state needs two numbers, the row and the column.</p>
<ul><li><strong>State</strong>: paths[r][c] is the number of routes from the start to cell (r, c).</li><li><strong>Transition</strong>: you arrived from above or from the left, so paths[r][c] = paths[r−1][c] + paths[r][c−1].</li><li><strong>Base</strong>: the start cell has 1 route. Blocked cells have 0.</li><li><strong>Answer</strong>: the bottom-right cell.</li></ul>
<p>Fill row by row, left to right, so the cells above and to the left are always ready. Before you start, click cells in the grid to add or remove construction blocks.</p>`,
  vizTitle: 'Count the routes', viz: vizGridPaths,
  code: {
    cpp: `int uniquePathsWithObstacles(vector<vector<int>>& g) {   // 1 = blocked
    int R = g.size(), C = g[0].size();
    vector<vector<long long>> dp(R, vector<long long>(C, 0));
    for (int r = 0; r < R; r++)
        for (int c = 0; c < C; c++) {
            if (g[r][c] == 1) continue;                    // blocked: 0 routes
            if (r == 0 && c == 0) { dp[r][c] = 1; continue; }
            long long up   = r > 0 ? dp[r - 1][c] : 0;
            long long left = c > 0 ? dp[r][c - 1] : 0;
            dp[r][c] = up + left;
        }
    return dp[R - 1][C - 1];
}`,
    py: `def unique_paths_with_obstacles(g):    # 1 = blocked
    R, C = len(g), len(g[0])
    dp = [[0] * C for _ in range(R)]
    for r in range(R):
        for c in range(C):
            if g[r][c] == 1:
                continue                    # blocked: 0 routes
            if r == 0 and c == 0:
                dp[r][c] = 1
                continue
            up = dp[r - 1][c] if r > 0 else 0
            left = dp[r][c - 1] if c > 0 else 0
            dp[r][c] = up + left
    return dp[R - 1][C - 1]`,
  },

  id: 'lcs', line: 'magenta', name: 'Longest Common Subsequence', short: 'LCS', mins: 40,
  story: 'Two friends compare playlists. What is the longest list of songs that appears in both, in the same order, even if other songs sit in between? Git uses this idea to show what changed between two versions of a file.',
  idea: `<p>A <strong>subsequence</strong> keeps the order but can skip letters: "ONE" is a subsequence of both "STONE" and "LONGEST".</p>
<ul><li><strong>State</strong>: dp[i][j] is the LCS length of the first i letters of A and the first j letters of B.</li><li><strong>Transition</strong>: if A[i] equals B[j], use both: dp[i−1][j−1] + 1 (the diagonal). If not, drop a letter from A or from B and keep the better result: max(dp[i−1][j], dp[i][j−1]).</li><li><strong>Base</strong>: row 0 and column 0 are 0. An empty string shares nothing.</li><li><strong>Answer</strong>: dp[n][m]. Walk back from it to recover the letters.</li></ul>
<p>Two strings mean a 2D table, one string down the side and one across the top. Edit Distance, Longest Palindromic Subsequence and many others use this exact layout.</p>`,
  vizTitle: 'Fill the LCS table', viz: vizLCS,
  code: {
    cpp: `int lcs(string A, string B) {
    int n = A.size(), m = B.size();
    vector<vector<int>> dp(n + 1, vector<int>(m + 1, 0));
    for (int i = 1; i <= n; i++)
        for (int j = 1; j <= m; j++)
            if (A[i - 1] == B[j - 1])
                dp[i][j] = dp[i - 1][j - 1] + 1;              // match: diagonal + 1
            else
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);   // drop a letter from A or B
    return dp[n][m];
}`,
    py: `def lcs(A, B):
    n, m = len(A), len(B)
    dp = [[0] * (m + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        for j in range(1, m + 1):
            if A[i - 1] == B[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1              # match: diagonal + 1
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])   # drop a letter from A or B
    return dp[n][m]`,
  },
  quiz: [

{
  id: 'knapsack', line: 'magenta', name: '0/1 Knapsack', short: 'Knapsack', mins: 40,
  story: 'You are packing for a Kasol trek with a bag that holds 6 kg. The tent, stove, camera and snacks each have a weight and a usefulness score. Each item goes in once or not at all. What is the most useful bag you can pack?',
  idea: `<ul><li><strong>State</strong>: dp[i][w] is the best score using only the first i items with w kg of space.</li><li><strong>Transition</strong>: for item i, either skip it, giving dp[i−1][w], or take it if it fits: its score + dp[i−1][w − its weight]. Keep the bigger.</li><li><strong>Base</strong>: row 0 (no items) is all 0.</li><li><strong>Answer</strong>: dp[n][W]. Walk back up the table to see which items were packed.</li></ul>
<p>Why "0/1"? Each item is used at most once, so after taking it we read from row i−1, where item i is no longer available. In Coin Change, coins could repeat, so we read from the same row. That one difference separates the two big families of choice DP.</p>
<p>Partition Equal Subset Sum, Target Sum and many "pick a subset" problems are knapsack in disguise.</p>`,
  vizTitle: 'Pack the bag', viz: vizKnapsack,
  code: {
    cpp: `int knapsack(vector<int>& wt, vector<int>& val, int W) {
    int n = wt.size();
    vector<vector<int>> dp(n + 1, vector<int>(W + 1, 0));
    for (int i = 1; i <= n; i++)
        for (int w = 0; w <= W; w++) {
            dp[i][w] = dp[i - 1][w];                             // skip item i
            if (wt[i - 1] <= w)
                dp[i][w] = max(dp[i][w],
                               val[i - 1] + dp[i - 1][w - wt[i - 1]]);  // take it
        }
    return dp[n][W];
}`,
    py: `def knapsack(wt, val, W):
    n = len(wt)
    dp = [[0] * (W + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        for w in range(W + 1):
            dp[i][w] = dp[i - 1][w]                          # skip item i
            if wt[i - 1] <= w:
                take = val[i - 1] + dp[i - 1][w - wt[i - 1]] # take it
                dp[i][w] = max(dp[i][w], take)
    return dp[n][W]`,
  },
  quiz: [
    { q: 'Taking item i reads from which row?', opts: ['Row i (the same row)', 'Row i − 1', 'Row 0'], a: 1, why: 'Row i − 1 is the world without item i, so it can\'t be taken twice.' },

{
  id: 'dp-recipe', line: 'magenta', name: 'DP Terminus', short: 'DP Terminus', mins: 30,
  story: 'End of the line. Every DP problem you just solved followed the same four steps. This station drills those steps on problems you haven\'t seen, so that next time you spot the pattern on your own.',
  idea: `<p>The recipe, for any DP problem:</p>
<ul><li><strong>State.</strong> Finish the sentence "dp[i] means …" (or dp[i][j]). If you can't say it in one sentence, the state is wrong.</li><li><strong>Transition.</strong> Look at the last step. What were the choices? Build the cell from smaller cells.</li><li><strong>Base cases.</strong> The smallest inputs, answered by hand.</li><li><strong>Order and answer.</strong> Fill the table so every cell only reads cells that are already done, then return the cell you need.</li></ul>
<p>Most DP problems in placement rounds belong to a handful of families:</p>
<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Family</th><th>You have seen</th><th>Try next</th></tr></thead><tbody>
<tr><td>1D line</td><td>Climbing Stairs, House Robber</td><td>Decode Ways, House Robber II</td></tr>
<tr><td>Unbounded choice</td><td>Coin Change</td><td>Perfect Squares, Word Break</td></tr>
<tr><td>Grid</td><td>Grid Paths</td><td>Minimum Path Sum, Maximal Square</td></tr>
<tr><td>Two strings</td><td>LCS</td><td>Edit Distance, Longest Palindromic Subsequence</td></tr>
<tr><td>Take or skip (0/1)</td><td>Knapsack</td><td>Partition Equal Subset Sum, Target Sum</td></tr>
<tr><td>Best ending at i</td><td>(new)</td><td>Longest Increasing Subsequence</td></tr>
</tbody></table></div>
<p>The code below uses the recipe on a new problem, Longest Increasing Subsequence. First, play the pattern game.</p>`,
  vizTitle: 'Name the pattern', viz: vizPatterns,
  code: {
    cpp: `// Longest Increasing Subsequence, built with the recipe
// STATE:      dp[i] = length of the longest increasing subsequence ending at a[i]
// TRANSITION: dp[i] = 1 + max(dp[j]) over j < i with a[j] < a[i]
// BASE:       every dp[i] starts at 1 (a[i] on its own)
// ANSWER:     the largest dp[i]
int lengthOfLIS(vector<int>& a) {
    int n = a.size(), best = 0;
    vector<int> dp(n, 1);
    for (int i = 0; i < n; i++) {
        for (int j = 0; j < i; j++)
            if (a[j] < a[i]) dp[i] = max(dp[i], dp[j] + 1);
        best = max(best, dp[i]);
    }
    return best;
}`,
    py: `# Longest Increasing Subsequence, built with the recipe
# STATE:      dp[i] = length of the longest increasing subsequence ending at a[i]
# TRANSITION: dp[i] = 1 + max(dp[j]) over j < i with a[j] < a[i]
# BASE:       every dp[i] starts at 1 (a[i] on its own)
# ANSWER:     the largest dp[i]
def length_of_lis(a):
    dp = [1] * len(a)
    for i in range(len(a)):
        for j in range(i):
            if a[j] < a[i]:
                dp[i] = max(dp[i], dp[j] + 1)
    return max(dp, default=0)`,
  },

const KEY = 'dsa-metro-progress-v1';
const blank = () => ({ v: 1, stations: {}, quiz: {}, solved: {}, predict: {}, days: {}, rev: {}, lang: 'cpp' });
function merge(a, b) {
  const o = blank();
  for (const k of ['stations', 'quiz', 'solved', 'days']) o[k] = Object.assign({}, (a && a[k]) || {}, (b && b[k]) || {});
  o.predict = Object.assign({}, (a && a.predict) || {});
  for (const [k, v] of Object.entries((b && b.predict) || {})) o.predict[k] = Math.max(o.predict[k] || 0, Number(v) || 0);
  for (const src of [a, b]) for (const [k, v] of Object.entries((src && src.rev) || {})) {
    if (!v || typeof v !== 'object') continue;
    const n = Number(v.n) || 0, t = Number(v.t) || 0, cur = o.rev[k];
    if (!cur || n > cur.n || (n === cur.n && t > cur.t)) o.rev[k] = { n, t };
  }
  o.lang = (b && b.lang) || (a && a.lang) || 'cpp';
  if (o.lang !== 'cpp' && o.lang !== 'py') o.lang = 'cpp';
  return o;
}
function canon(x) {
  if (Array.isArray(x)) return '[' + x.map(canon).join(',') + ']';
  if (x && typeof x === 'object') return '{' + Object.keys(x).sort().map(k => JSON.stringify(k) + ':' + canon(x[k])).join(',') + '}';
  return JSON.stringify(x);
}

function streak() {
  const d = new Date();
  if (!S.days[dayKey(d)]) { d.setDate(d.getDate() - 1); if (!S.days[dayKey(d)]) return 0; }

function Stepper(host, render, ms) {
  let frames = [], i = 0, timer = null;
  const count = h('span', { class: 'step-count' });
  const bBack = btn('← Back', () => { stop(); go(i - 1); });
  const bPlay = btn('Play', () => (timer ? stop() : play()), 'primary');
  const bNext = btn('Step →', () => { stop(); go(i + 1); });
  const bReset = btn('Reset', () => { stop(); go(0); }, 'ghost');
  host.append(h('div', { class: 'controls' }, bBack, bPlay, bNext, bReset, count));
  function go(k) {
    i = Math.max(0, Math.min(frames.length - 1, k));
    render(frames[i], i);
    count.textContent = 'Step ' + (i + 1) + ' of ' + frames.length;
    bBack.disabled = i === 0; bNext.disabled = i >= frames.length - 1;
  }
  function play() {
    if (i >= frames.length - 1) go(0);
    bPlay.textContent = 'Pause';
    timer = setInterval(() => { if (i >= frames.length - 1) { stop(); return; } go(i + 1); }, ms || 1100);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } bPlay.textContent = 'Play'; }
  onCleanup(stop);
  return { load(f) { stop(); frames = f; go(0); } };
}

function vizGuess(host) {
  let lo, hi, secret, tries, guesses, auto = null, over;
  const range = h('div', { class: 'grange' });
  const track = h('div', { class: 'gtrack' }, range);
  const inp = h('input', { type: 'number', id: 'guess-in', min: '1', max: '1000', inputmode: 'numeric', placeholder: '1–1000', style: 'width:8em' });
  const go = h('button', { type: 'button', class: 'btn small primary' }, 'Guess');
  const autoB = btn('Let binary search play', () => autoPlay());
  const fresh = btn('New number', () => start(), 'ghost');
  const left = h('span', { class: 'big-num' });
  const msg = h('p', { class: 'msg' });
  const log = h('div', { class: 'glog' });
  host.append(h('p', { class: 'viz-note' }, 'I picked a whole number from 1 to 1000. Each guess tells you higher or lower. Can you find it in 10 guesses?'),
    h('div', { class: 'setup' }, h('label', { for: 'guess-in' }, 'Your guess'), inp, go, autoB, fresh),
    h('div', {}, track, h('div', { class: 'gscale' }, h('span', {}, '1'), h('span', {}, '500'), h('span', {}, '1000'))),
    h('div', { class: 'setup' }, h('span', {}, 'Numbers still possible:'), left), msg, log);
  function draw() {
    range.style.left = ((lo - 1) / 1000 * 100) + '%';
    range.style.width = ((hi - lo + 1) / 1000 * 100) + '%';
    left.textContent = over ? '1' : inr(hi - lo + 1) + ' (' + lo + ' to ' + hi + ')';
  }
  function guess(g) {
    if (over) return;
    g = Math.round(Number(g));
    if (!Number.isFinite(g) || g < 1 || g > 1000) { msg.className = 'msg bad'; msg.textContent = 'Type a whole number from 1 to 1000.'; return; }
    if (g < lo || g > hi) { msg.className = 'msg'; msg.textContent = 'You already know it is between ' + lo + ' and ' + hi + '. Guessing ' + g + ' wastes a try.'; return; }
    tries++;
    track.append(h('div', { class: 'gmark', style: 'left:' + ((g - 0.5) / 1000 * 100) + '%' }));
    if (g === secret) {
      over = true; lo = hi = g;
      log.append(h('span', { class: 'ok' }, g));
      msg.className = 'msg good';
      msg.textContent = 'Found ' + secret + ' in ' + tries + ' guess' + (tries === 1 ? '' : 'es') + '. ' + (tries <= 10 ? 'That is binary search speed.' : 'Always guessing the middle never needs more than 10.');
      stopAuto();
    } else if (g < secret) { lo = g + 1; log.append(h('span', { class: 'lo' }, g)); msg.className = 'msg'; msg.textContent = g + ' is too low. Throw away everything up to ' + g + '.'; }
    else { hi = g - 1; log.append(h('span', { class: 'hi' }, g)); msg.className = 'msg'; msg.textContent = g + ' is too high. Throw away everything from ' + g + ' up.'; }
    draw();
  }
  function stopAuto() { if (auto) { clearInterval(auto); auto = null; } }
  function autoPlay() {
    if (over) start();
    stopAuto();
    auto = setInterval(() => { if (over) { stopAuto(); return; } const mid = Math.floor((lo + hi) / 2); inp.value = mid; guess(mid); }, 750);
  }
  function start() {
    stopAuto();
    lo = 1; hi = 1000; tries = 0; over = false; secret = 1 + Math.floor(Math.random() * 1000);
    log.innerHTML = ''; $$('.gmark', track).forEach(m => m.remove());
    msg.className = 'msg'; msg.textContent = 'Tip: guess the middle of what is left.';
    inp.value = '';
    draw();
  }
  go.addEventListener('click', () => { stopAuto(); guess(inp.value); inp.select(); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { stopAuto(); guess(inp.value); inp.select(); } });
  onCleanup(stopAuto);
  start();
}

function vizSortRace(host) {
  const N = 24;
  let timer = null, racers = [];
  const startB = btn('Start race', () => (timer ? pause() : run()), 'primary');
  const shuf = btn('Shuffle', () => { pause(); setup(); }, 'ghost');
  const race = h('div', { class: 'race' });
  const msg = h('p', { class: 'msg' });
  host.append(h('p', { class: 'viz-note' }, 'Both sort the same 24 numbers. Each tick is one comparison. Dark bars are the ones being compared or written.'), race, h('div', { class: 'controls' }, startB, shuf), msg);
  function* bubble(a) {
    let c = 0; const n = a.length;
    for (let i = 0; i < n - 1; i++) {
      let swapped = false;
      for (let j = 0; j < n - 1 - i; j++) {
        c++;
        if (a[j] > a[j + 1]) { [a[j], a[j + 1]] = [a[j + 1], a[j]]; swapped = true; }
        yield { hi: [j, j + 1], c };
      }
      if (!swapped) break;
    }
    return { hi: [], c };
  }
  function* merge(a) {
    let c = 0; const n = a.length;
    for (let w = 1; w < n; w *= 2) {
      for (let lo = 0; lo < n - w; lo += 2 * w) {
        const mid = lo + w, hi = Math.min(lo + 2 * w, n);
        const L = a.slice(lo, mid), R = a.slice(mid, hi);
        let i = 0, j = 0, k = lo;
        while (i < L.length && j < R.length) { c++; a[k++] = L[i] <= R[j] ? L[i++] : R[j++]; yield { hi: [k - 1], c }; }
        while (i < L.length) a[k++] = L[i++];
        while (j < R.length) a[k++] = R[j++];
      }
    }
    return { hi: [], c };
  }
  function setup() {
    const base = shuffle(Array.from({ length: N }, (_, i) => i + 1));
    race.innerHTML = ''; msg.textContent = '';
    racers = [['Bubble sort', 'O(n²)', bubble], ['Merge sort', 'O(n log n)', merge]].map(([name, big, gen]) => {
      const a = base.slice();
      const bars = h('div', { class: 'bars' }, a.map(() => h('i')));
      const count = h('span', {}, '0 comparisons');
      race.append(h('div', { class: 'racer' }, h('h3', {}, name + ' · ' + big, count), bars));
      const r = { name, a, it: gen(a), bars, count, c: 0, done: false };
      paint(r, []);
      return r;
    });
    startB.textContent = 'Start race';
  }
  function paint(r, hi) {
    [...r.bars.children].forEach((b, i) => { b.style.height = (r.a[i] / N * 100) + '%'; b.classList.toggle('hi', hi.includes(i)); });
    r.count.textContent = r.c + ' comparisons';
    r.bars.classList.toggle('done', r.done);
  }
  function tick() {
    for (const r of racers) {
      if (r.done) continue;
      const step = r.it.next();
      if (step.value) r.c = step.value.c;
      if (step.done) r.done = true;
      paint(r, step.done ? [] : step.value.hi);
    }
    if (racers.every(r => r.done)) {
      pause(); startB.textContent = 'Race again'; startB.onclick = null;
      msg.className = 'msg good';
      msg.textContent = 'Bubble sort: ' + racers[0].c + ' comparisons. Merge sort: ' + racers[1].c + '. With 10⁵ numbers the gap becomes about 5 × 10⁹ against 1.7 million.';
    }
  }
  function run() {
    if (racers.every(r => r.done)) setup();
    startB.textContent = 'Pause';
    timer = setInterval(tick, 40);
  }
  function pause() { if (timer) { clearInterval(timer); timer = null; } if (!racers.every(r => r.done)) startB.textContent = 'Resume'; }
  onCleanup(() => { if (timer) clearInterval(timer); });
  setup();
}

    for (let p = -1; p < n; p++) {
      let arrow = '';

      else if (p + 1 < n && f.next[p + 1] === p) arrow = '←';

  const snap = (m, end) => fr.push({ next: next.slice(), prev, curr, nxt, msg: m, end });
  snap('Start: prev = null, curr = head (1). Every arrow points right.');

function vizMaze(host) {
  const RAW = [
    '...............',

    '.#...#...#.#...',
    '.#####.###.###.',
    '.......#.......',

  const bReset = btn('Reset maze', () => { stop(); walls = RAW.map(r => [...r].map(c => c === '#')); paint(); }, 'ghost');
  host.append(h('p', { class: 'viz-note' }, 'Find a way from the green cell to the yellow one. Click cells to add or remove walls, then race the two searches.'),
    h('div', { class: 'controls' }, bBfs, bDfs, bClear, bReset), grid,
    h('div', { class: 'maze-legend' },

      h('span', { class: 'l-red' }, h('i', { style: 'background:color-mix(in srgb,var(--line) 30%,var(--surface))' }), 'visited'),
      h('span', { class: 'l-red' }, h('i', { style: 'background:var(--line)' }), 'path found')), msg);

        if (r === GR && c === GC) { found = true; break; }
        for (const [dr, dc] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
          const nr = r + dr, nc = c + dc;
          if (ok(nr, nc) && !seen[nr][nc]) st.push([nr, nc, [r, c]]);

    stop();

    let k = 0, pk = 0;

    }, 22);
  }
  onCleanup(() => { if (timer) clearInterval(timer); });
  paint();
}

/* DP table game: predict each cell, or watch it fill */
function DPTable(host, st, cfg) {
  const R = cfg.rows, C = cfg.cols;
  const truth = [], why = [], deps = [], isBase = [];
  const get = (i, j) => (i < 0 || j < 0 || i >= R || j >= C) ? undefined : truth[i][j];
  for (let i = 0; i < R; i++) {
    truth.push([]); why.push([]); deps.push([]); isBase.push([]);
    for (let j = 0; j < C; j++) {
      if (cfg.base(i, j)) { isBase[i][j] = true; truth[i][j] = cfg.baseVal(i, j); deps[i][j] = []; why[i][j] = ''; }
      else { isBase[i][j] = false; const r = cfg.calc(i, j, get); truth[i][j] = r.v; deps[i][j] = r.deps; why[i][j] = r.why; }
    }
  }
  const order = [];
  for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) if (!isBase[i][j]) order.push([i, j]);
  const fmt = v => v === Infinity ? '∞' : String(v);
  let pos = 0, mode = 'predict', tries = 0, combo = 0, correct = 0, timer = null, showDeps = [], pathKeys = null, finished = false;
  let filled = isBase.map(r => r.slice());

  const modeSeg = seg([['predict', 'I\'ll fill it'], ['watch', 'Show me']], mode, m => setMode(m), 'Mode');
  const comboEl = h('span', { class: 'combo' });
  const progEl = h('span', {});
  const table = h('table', { class: 'dp' });
  const tds = [];
  const thead = h('tr', {}, h('th', {}, cfg.corner || ''));
  for (let j = 0; j < C; j++) thead.append(h('th', { scope: 'col' }, cfg.colHead(j)));
  table.append(h('thead', {}, thead));
  const tbody = h('tbody');
  for (let i = 0; i < R; i++) {
    const tr = h('tr', {}, h('th', { scope: 'row', class: 'rowh' + (cfg.wideRows ? ' wide' : '') }, cfg.rowHead(i)));
    tds.push([]);
    for (let j = 0; j < C; j++) {
      const td = h('td');
      if (cfg.onCellClick) td.addEventListener('click', () => { if (pos === 0 && !finished && cfg.clickable(i, j)) cfg.onCellClick(i, j); });
      tds[i].push(td); tr.append(td);
    }
    tbody.append(tr);
  }
  table.append(tbody);
  const status = h('div', { class: 'dp-status', 'aria-live': 'polite' });
  const input = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': 'Value for the highlighted cell', id: 'dp-in-' + st.id });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  const bCheck = btn('Check', () => check(), 'primary');
  const bReveal = btn('Show this cell', () => reveal());
  const bStep = btn('Step →', () => { stop(); stepWatch(); }, 'primary');
  const bPlay = btn('Play', () => (timer ? stop() : play()));
  const bReset = btn('Start over', () => reset(), 'ghost');
  const ctrls = h('div', { class: 'controls' });
  if (cfg.side) host.append(cfg.side.el);
  host.append(h('div', { class: 'dp-top' }, modeSeg.el, h('div', { class: 'dp-meta' }, comboEl, progEl)), h('div', { class: 'dp-scroll' }, table), status, ctrls);

  const key = (i, j) => i + ',' + j;
  function paint() {
    const cur = pos < order.length && !finished ? order[pos] : null;
    const dk = new Set(showDeps.map(([a, b]) => key(a, b)));
    for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) {
      const td = tds[i][j], cls = [];
      if (isBase[i][j]) cls.push('base'); else if (filled[i][j]) cls.push('filled');
      const extra = cfg.cellClass && cfg.cellClass(i, j); if (extra) cls.push(extra);
      if (dk.has(key(i, j))) cls.push('dep');
